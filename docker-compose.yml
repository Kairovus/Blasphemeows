services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blasphemeows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - blasphemeows_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blasphemeows"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/blasphemeows
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: blasphemeows-prod-change-this-secret-to-something-long
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  blasphemeows_pg:
